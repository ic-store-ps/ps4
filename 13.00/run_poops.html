<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ic Store- Poops Exploit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Fredoka+One&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --alex-blue: #6ebdec; --alex-white: #ffffff; --dark-bg: #2c2c2c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh; background: #1a1a1a; color: #fff;
    font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden;
  }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(110, 189, 236, 0.15) 0%, rgba(26,26,26,1) 100%); z-index: 0; }

  .hud-container {
    position: relative; z-index: 1; width: 95%; max-width: 600px; background: var(--dark-bg);
    border: 4px solid var(--alex-white); border-radius: 20px; padding: 40px 30px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(110, 189, 236, 0.4); text-align: center;
  }

  .brand-title { font-family: 'Fredoka One', cursive; font-size: 4rem; color: var(--alex-blue); letter-spacing: 2px; margin-bottom: 5px; direction: ltr; text-shadow: -3px -3px 0 var(--alex-white), 3px -3px 0 var(--alex-white), -3px 3px 0 var(--alex-white), 3px 3px 0 var(--alex-white), 0 5px 15px rgba(0,0,0,0.5); }
  .brand-sub { font-size: 1rem; color: #ddd; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; direction: ltr; }

  .status-panel { background: rgba(0, 0, 0, 0.5); padding: 20px; border-radius: 12px; border: 2px dashed var(--alex-blue); margin-bottom: 15px; position: relative; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5); }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--alex-white); color: var(--alex-blue); padding: 4px 15px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 20px; }

  #state { font-size: 24px; font-weight: 900; color: var(--alex-white); text-align: center; margin-bottom: 10px; }
  
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: var(--alex-white); border-radius: 50%; animation: bounce 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; background: var(--alex-blue); } .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { to { transform: translateY(-10px); opacity: 0.5; } }

  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--alex-blue); border-radius: 8px; padding: 14px; max-height: 250px; overflow-y: auto; color: #c8ced8; direction: ltr; text-align: left; }

  .done { color: #00ff88 !important; text-shadow: 0 0 10px #00ff88 !important; }
  .error { color: #ff3333 !important; text-shadow: 0 0 10px #ff3333 !important; }
  
  .powered-by { position: fixed; bottom: 12px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px; color: rgba(255, 255, 255, 0.4); z-index: 10; direction: ltr; }
  .powered-by span { color: var(--alex-blue); font-weight: 900; text-shadow: 0 0 5px var(--alex-blue); }
  .footer-sys { position: fixed; bottom: 12px; left: 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 10; direction: ltr; }

  @media (max-width: 600px) { .brand-title { font-size: 3rem; } .hud-container { padding: 30px 15px; } .powered-by { font-size: 10px; right: 10px; } .footer-sys { font-size: 9px; left: 10px; } }
</style>
</head>
<body>

<div class="hud-container">
  <h1 class="brand-title">ic Store</h1>
  <div class="brand-sub">POOPS EXPLOIT</div>

  <div class="status-panel">
    <div id="state">
      <span id="stateText">جارٍ تحميل سلسلة Poops<br><small>Please Wait...</small></span>
      <div class="loader-wrapper">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  
  <div id="out-container"><div id="out"></div></div>
</div>

<div class="powered-by">POWERED BY <span>Kamal Atef</span></div>
<div class="footer-sys">ic Store OS v2.0 - Poops</div>

<script type="module">
import "./chain_poops.js";

const state = document.getElementById("state");
const stateText = document.getElementById("stateText");

window.poopsDone = function () {
  state.classList.add("done");
  stateText.innerHTML = "اكتملت العملية بنجاح<br><small>EXPLOIT SUCCESSFUL</small>";
  document.querySelector('.loader-wrapper').style.display = 'none';
};

window.poopsError = function () {
  state.classList.add("error");
  stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>EXPLOIT FAILED</small>";
  document.querySelector('.loader-wrapper').style.display = 'none';
};
</script>
</body>
</html>
